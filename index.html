<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЭлектроКабель</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f8; }
        .header { display: flex; align-items: center; gap: 15px; padding: 15px 20px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 10; }
        .burger-btn { display: flex; flex-direction: column; justify-content: space-between; width: 28px; height: 20px; background: none; border: none; cursor: pointer; padding: 0; }
        .burger-btn span { display: block; width: 100%; height: 3px; background-color: #2b5797; border-radius: 2px; }
        .logo { display: flex; align-items: center; gap: 8px; font-weight: bold; font-size: 18px; color: #222; }
        .logo-icon { width: 32px; height: 32px; background: #e3f2fd; color: #1976d2; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); opacity: 0; visibility: hidden; transition: opacity 0.3s ease; z-index: 99; }
        .overlay.active { opacity: 1; visibility: visible; }
        .side-menu { position: fixed; top: 0; left: -300px; width: 280px; height: 100%; background: #ffffff; box-shadow: 4px 0 20px rgba(0, 0, 0, 0.1); transition: left 0.3s ease; z-index: 100; padding: 20px 15px; overflow-y: auto; border-radius: 0 20px 20px 0; }
        .side-menu.active { left: 0; }
        .menu-section-title { font-size: 14px; font-weight: 700; color: #666; margin: 20px 0 10px 10px; text-transform: uppercase; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 12px; text-decoration: none; color: #000; transition: background 0.2s; margin-bottom: 4px; }
        .menu-item:hover { background: #f4f6f8; }
        .menu-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .blue-bg { background: #e3f2fd; } .gray-bg { background: #ffebee; } .green-bg { background: #e8f5e9; } .light-green-bg { background: #f1f8e9; } .dark-bg { background: #eceff1; }
        .menu-text { display: flex; flex-direction: column; }
        .menu-text .title { font-size: 14px; font-weight: 600; color: #222; }
        .menu-text .sub { font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <header class="header">
        <button class="burger-btn" id="burgerBtn"><span></span><span></span><span></span></button>
        <div class="logo"><div class="logo-icon">⚡️</div><span>ЭлектроКабель</span></div>
    </header>
    <div class="overlay" id="overlay"></div>
    <nav class="side-menu" id="sideMenu">
        <div class="menu-section-title">Меню</div>
        <a href="#" class="menu-item"><div class="menu-icon blue-bg">🛒</div><div class="menu-text"><span class="title">Корзина</span><span class="sub">2 товара</span></div></a>
        <a href="#" class="menu-item"><div class="menu-icon gray-bg">❤️</div><div class="menu-text"><span class="title">Избранное</span></div></a>
        <a href="#" class="menu-item"><div class="menu-icon blue-bg">👤</div><div class="menu-text"><span class="title">Личные данные</span></div></a>
        <a href="#" class="menu-item"><div class="menu-icon green-bg">📍</div><div class="menu-text"><span class="title">Адреса доставки</span></div></a>
        <a href="#" class="menu-item"><div class="menu-icon light-green-bg">📦</div><div class="menu-text"><span class="title">Мои заказы</span></div></a>
        <div class="menu-section-title">Для администратора</div>
        <a href="#" class="menu-item"><div class="menu-icon dark-bg">⚙️</div><div class="menu-text"><span class="title">Вход в Админ-панель</span></div></a>
 <a href="#" class="menu-item"><div class="menu-icon dark-bg">🗄</div><div class="menu-text"><span class="title">Управление товарами</span></div></a>
    </nav>
    <script>
        const burgerBtn = document.getElementById('burgerBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('overlay');
        function toggleMenu() { sideMenu.classList.toggle('active'); overlay.classList.toggle('active'); }
        burgerBtn.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>
</html>
